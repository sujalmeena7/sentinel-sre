# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Declarative replacement for hand-clicking the dashboard. The previous deploy
# had no blueprint, so its configuration lived only in the Render UI: when the
# service broke there was nothing in the repo to compare against or rebuild from.
#
# Apply with: Render Dashboard -> New -> Blueprint -> point at this repo.
# Secrets are marked `sync: false`, so Render prompts for them instead of them
# ever being committed here.

databases:
  - name: sentinel-db
    databaseName: sentinel
    user: sentinel
    plan: free
    # NOTE: Render's FREE Postgres is deleted 30 days after creation (and older
    # free instances expired at 90 days). That is the most likely cause of the
    # current outage — the app booted against a database that no longer existed.
    # Upgrade to a paid plan for anything you need to survive.

services:
  - type: web
    name: sentinel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # Single worker is required, not a cost saving: background analysis uses an
    # in-process thread pool and an in-memory task registry, so a second worker
    # would not see tasks started by the first. --timeout 180 covers synchronous
    # LLM calls (postmortem generation). These are repeated here for visibility,
    # but backend/gunicorn.conf.py is auto-loaded and sets the same values, so a
    # start command that omits them still gets them.
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --timeout 180 --graceful-timeout 30 --keep-alive 75
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Browser origins for the deployed frontend. Added to the built-in
      # defaults in main.py rather than replacing them.
      - key: ALLOWED_ORIGINS
        value: https://sentinelsre.vercel.app,https://sentinel-sre-zeta.vercel.app
      - key: FRONTEND_URL
        value: https://sentinelsre.vercel.app
      # Free instances have no persistent disk, so the vector store is rebuilt
      # from Postgres on each boot by the deferred backfill in main.py. Point
      # CHROMA_PATH at a mounted disk once on a paid plan and drop the rebuild.
      - key: CHROMA_PATH
        value: /tmp/chroma_db
      - key: RAG_INDEX_BACKFILL
        value: "1"
      # ── LLM providers ────────────────────────────────────────────
      # Chain order is gateway -> Groq -> OpenAI. The gateway is where the paid
      # credit is; the direct keys behind it are exhausted free tiers kept only
      # as a last resort. All three gateway values are required for it to be
      # used at all — a missing model id would 404 on every call. Only the key
      # is a secret; the base URL and model ids are committed so a redeploy
      # reproduces the same chain instead of depending on dashboard state.
      - key: LLM_GATEWAY_API_KEY
        sync: false
      - key: LLM_GATEWAY_BASE_URL
        value: https://tokenbom.com/v1
      # Chosen by measurement, not by latency alone: on the real analysis prompt
      # this was both the fastest (~40s median) and the cheapest per analysis of
      # the models that returned all six required sections. The fastest
      # responder overall on this gateway costs ~240x as much per analysis.
      # Re-check with `python scripts/check_gateway.py` when supply shifts.
      - key: LLM_GATEWAY_MODEL
        value: deepseek-v4-flash
      # Different model families, for supply diversity: a quota-sharing gateway
      # drains one upstream pool at a time, so a same-family fallback tends to
      # be unavailable in the same moment.
      - key: LLM_GATEWAY_FALLBACK_MODELS
        value: minimax-m2.7,qwen3.7-plus,deepseek-v4-pro-0813
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      # Measured on this gateway: a real narrative takes a ~40s median and up to
      # ~56s, so the old 20s per-attempt default cut off most healthy calls. The
      # 150s chain budget stays under gunicorn's 180s timeout so a total provider
      # failure still returns the data-only postmortem instead of a 502.
      - key: LLM_TIMEOUT_SECONDS
        value: "90"
      - key: LLM_TOTAL_BUDGET_SECONDS
        value: "150"
      # Lets you read /api/v1/diagnostics when the app is too broken to log in.
      - key: DIAGNOSTICS_TOKEN
        generateValue: true

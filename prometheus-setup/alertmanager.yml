
route:
  receiver: sentinel-sre

receivers:
  - name: sentinel-sre
    webhook_configs:
      # Replace YOUR_WEBHOOK_TOKEN with your actual webhook token from Sentinel-SRE registration.
      # NEVER commit real tokens to source control.
      - url: "https://YOUR-BACKEND-HOST/api/v1/telemetry/prometheus/YOUR_WEBHOOK_TOKEN"
        send_resolved: true
